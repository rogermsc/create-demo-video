name: Release

# Publishing from CI rather than a laptop, because an interactive OTP is a bad
# gate for something that should be reproducible: the tag is the trigger, and
# what ships is exactly what CI tested.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The whole authentication story. npm mints a short-lived credential from
      # this OIDC token, so there is no long-lived npm token to leak, rotate or
      # paste into a chat window — and provenance comes free with it, signed
      # against the commit and workflow that built the tarball.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      # v6, not v4: `package-manager-cache` does not exist before it, and an
      # input the action does not know is an input it ignores.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Never cache in a release build: what ships should come from the
          # lockfile, not from whatever a previous run happened to leave behind.
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships something new
      # enough today, but a release that silently falls back to "no credentials"
      # is a bad way to find out that stopped being true.
      - run: npm install -g npm@latest

      - run: npm test

      # A tag that disagrees with package.json publishes a version nobody asked
      # for, and npm will not let you take it back.
      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json $PKG" >&2
            exit 1
          fi

      # The real check: the package's whole job is producing a working project.
      - run: node index.js smoke-project
      - run: npm install
        working-directory: smoke-project
      - run: npm run doctor
        working-directory: smoke-project
      - run: rm -rf smoke-project

      # No `NODE_AUTH_TOKEN`, and no `--provenance`: npm detects the OIDC
      # environment, exchanges the token above for a short-lived credential and
      # attaches provenance itself. A token here would only put back the thing
      # this removed.
      - run: npm publish --access public
